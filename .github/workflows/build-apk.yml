name: Build Origin OS APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Build APK
        run: |
          if [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            export STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            gradle :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Prepare Single APK Output
        run: |
          rm -rf build-outputs
          mkdir -p build-outputs
          
          # Find the built release or debug APK
          APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build-outputs/Origin_OS.apk
            echo "Successfully packaged single APK: build-outputs/Origin_OS.apk"
          else
            echo "Error: No APK found after build"
            exit 1
          fi
          
          cd build-outputs
          ls -lh

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Origin_OS_APK
          path: build-outputs/Origin_OS.apk
          if-no-files-found: error
          retention-days: 30
