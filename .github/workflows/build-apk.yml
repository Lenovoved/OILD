name: Build Origin OS APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          if [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            export STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            gradle :app:assembleRelease --stacktrace
          else
            echo "Building standard release / debug APK"
            gradle :app:assembleRelease --stacktrace || true
          fi

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-outputs
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-outputs/ \;
          cd build-outputs
          for file in *.apk; do
            if [[ "$file" == *"debug"* ]]; then
              cp "$file" "Origin_OS_debug.apk"
            elif [[ "$file" == *"release"* ]]; then
              cp "$file" "Origin_OS_release.apk"
            fi
          done
          # Ensure Origin_OS.apk exists
          if [ -f "Origin_OS_debug.apk" ] && [ ! -f "Origin_OS.apk" ]; then
            cp "Origin_OS_debug.apk" "Origin_OS.apk"
          fi
          ls -la

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Origin_OS_APK
          path: build-outputs/*.apk
          retention-days: 30
